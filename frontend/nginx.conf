# HTTPS only: the backend's cookies are HTTPS-only. The certificate files are
# mounted from the host (see compose.prod.yaml).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;

    # The API: "backend" is the service name in compose.prod.yaml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # The backend limits the password requests per client address, and
        # only accepts HTTPS requests.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The file names of the build contain a hash, so they can be cached for good.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Any other path is a route of the Angular application.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
