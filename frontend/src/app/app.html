<header class="app-header">
  <h1><a routerLink="/">Course Revision Platform</a></h1>
  <nav class="main-nav" aria-label="Main">
    <details #triviaMenu class="nav-menu">
      <summary>Trivia game</summary>
      <div class="nav-menu-items">
        <a routerLink="/trivia" (click)="triviaMenu.open = false">Play</a>
        @if (user()) {
          <a routerLink="/trivia/scores" (click)="triviaMenu.open = false">My scores</a>
        }
      </div>
    </details>
  </nav>
  <nav class="user-nav" aria-label="Account">
    @if (user(); as user) {
      <a routerLink="/results">My results</a>
      @if (canManageRoles()) {
        <a routerLink="/admin">Administration</a>
      }
      <a routerLink="/account">{{ user.displayName }}</a>
      <button type="button" class="button-secondary" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/sign-in">Sign in</a>
      <a class="button" routerLink="/register">Create an account</a>
    }
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
